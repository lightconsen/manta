# Tarpaulin code coverage configuration for Manta
# Run with: cargo tarpaulin --config .tarpaulin.toml

[default]
# Target 80% coverage threshold (matches project goal)
fail-under = 80

# Output formats
out = ["Html", "Xml", "Terminal"]

# Exclude test files and generated code from coverage
exclude-files = [
    "tests/*",
    "tests/**/*",
    "crates/*/tests/*",
    "**/target/**",
]

# Line coverage mode (default)
line = true

# Branch coverage (optional, more strict)
branch = false

# Follow execution into other crates in the workspace
follow-exec = true

# Run tests in release mode for faster execution (optional)
# release = false

# Timeout for test execution (seconds)
timeout = "120s"

# Exclude integration/e2e tests from the default run — they are slower and
# run separately via `cargo test --test '*'` or the layer aliases.
exclude-tests = false
