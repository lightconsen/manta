# Syscity MCP Server Presets
#
# This file defines the MCP server presets shown in the Settings UI.
# You can freely edit this file — add new presets, modify existing ones,
# or remove any you don't need. Changes take effect on the next page refresh.
#
# Format:
#   [preset_name]
#   display_name = "..."    # Human-readable name shown in UI
#   description = "..."     # Short description of what this server does
#   command = "npx"         # Command to run (stdio transport)
#   args = ["..."]          # Command arguments
#   transport = "stdio"     # Transport type: stdio, sse, or streamable_http

[github]
display_name = "GitHub"
description = "Repository management, PRs, issues, code search"
logo_url = "https://cdn.simpleicons.org/github"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
transport = "stdio"

