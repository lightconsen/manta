# Clippy configuration for Syscity
# See: https://rust-lang.github.io/rust-clippy/master/index.html

# Cognitive complexity threshold
cognitive-complexity-threshold = 25

# Too many arguments threshold
too-many-arguments-threshold = 7

# Too many lines threshold
too-many-lines-threshold = 100

# Large enum variant size (in bytes)
enum-variant-size-threshold = 200

# Large type threshold (in bytes)
type-complexity-threshold = 250

# Single char binding names threshold
single-char-binding-names-threshold = 5

# Additional strictness for gateway correctness review.
# These options configure specific lints; the actual enable/deny levels live
# in Cargo.toml [lints.clippy] so they can be toggled incrementally.

# Allow paths to be a bit longer while we refactor; gate the deny level later.
