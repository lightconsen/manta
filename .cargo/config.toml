# Cargo configuration for Manta
# Provides test-layer aliases matching OpenClaw's 6-layer architecture.

[alias]
# Unit tests — fast, parallel, no external services
unit-test = "test --lib"

# Integration tests — test module interactions, still isolated
integration-test = "test --test integration_tests --test agent_session_flow --test memory_contracts --test provider_contracts --test channel_contracts --test tool_contracts"

# Contract tests — serialization/API contract verification (fast, parallel)
contract-test = "test --test provider_contracts --test memory_contracts --test channel_contracts --test tool_contracts"

# Provider live tests — wiremock-based API simulation, serial execution
provider-test = "test --test provider_live --test provider_streaming"

# Streaming tests — SSE / event-stream parsing
streaming-test = "test --test provider_streaming"

# Snapshot tests — insta snapshot regression
snapshot-test = "test --test snapshot_contracts"

# End-to-end tests — full HTTP roundtrip with Agent + Engine
e2e-test = "test --test e2e_server_flow --test e2e_browser"

# Browser E2E smoke tests — headless Chrome verification
browser-test = "test --test e2e_browser"

# Run all tests (unit + integration + contract + e2e)
test-all = "test"

# Coverage run using tarpaulin
coverage = "tarpaulin --config .tarpaulin.toml"

# Benchmarks
bench-serialization = "bench --bench serialization"
bench-routing = "bench --bench message_routing"
