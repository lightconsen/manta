<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manta</title>
    <style>
        :root {
            --bg: #ffffff; --bg-secondary: #f7f7f8; --bg-sidebar: #f9f9f9;
            --text: #1a1a1a; --text-secondary: #6b7280; --border: #e5e7eb;
            --accent: #2563eb; --accent-hover: #1d4ed8; --user-bg: #eff6ff; --assistant-bg: #f9fafb;
            --code-bg: #f3f4f6; --radius: 0.75rem;
        }
        [data-theme="dark"] {
            --bg: #1a1a1a; --bg-secondary: #202020; --bg-sidebar: #171717;
            --text: #e5e5e5; --text-secondary: #a3a3a3; --border: #333333;
            --accent: #3b82f6; --accent-hover: #2563eb; --user-bg: #1e3a5f; --assistant-bg: #262626;
            --code-bg: #2d2d2d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden; }
        .sidebar { width: 260px; background: var(--bg-sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
        .sidebar-header { padding: 1rem; border-bottom: 1px solid var(--border); }
        .new-chat-btn { width: 100%; padding: 0.6rem; background: var(--accent); color: white; border: none; border-radius: var(--radius); cursor: pointer; font-size: 0.875rem; }
        .new-chat-btn:hover { background: var(--accent-hover); }
        .connection-status { padding: 0.5rem 1rem; font-size: 0.75rem; display: flex; align-items: center; gap: 0.5rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; }
        .status-dot.connected { background: #22c55e; }
        .main { flex: 1; display: flex; flex-direction: column; }
        .header { height: 48px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; padding: 0 1rem; }
        .header-title { font-size: 0.875rem; font-weight: 500; }
        .theme-toggle { background: none; border: none; cursor: pointer; font-size: 1.1rem; padding: 0.25rem; }
        .messages { flex: 1; overflow-y: auto; padding: 1rem 0; }
        .message { padding: 1rem 1.5rem; display: flex; gap: 0.75rem; }
        .message.user { background: var(--user-bg); }
        .message.assistant { background: var(--assistant-bg); }
        .message.system { background: transparent; opacity: 0.7; font-size: 0.8rem; justify-content: center; }
        .avatar { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.75rem; font-weight: 600; flex-shrink: 0; }
        .avatar.user { background: var(--accent); color: white; }
        .avatar.assistant { background: #10b981; color: white; }
        .content { flex: 1; line-height: 1.6; font-size: 0.9375rem; white-space: pre-wrap; word-break: break-word; }
        .content code { background: var(--code-bg); padding: 0.1rem 0.3rem; border-radius: 4px; font-family: 'SF Mono', Monaco, monospace; font-size: 0.85em; }
        .content pre { background: var(--code-bg); padding: 0.75rem; border-radius: var(--radius); overflow-x: auto; margin: 0.5rem 0; }
        .input-area { border-top: 1px solid var(--border); padding: 1rem 1.5rem; }
        .input-wrapper { display: flex; gap: 0.5rem; align-items: flex-end; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.75rem; }
        .input-wrapper:focus-within { border-color: var(--accent); }
        textarea { flex: 1; background: transparent; border: none; outline: none; resize: none; font-family: inherit; font-size: 0.9375rem; color: var(--text); max-height: 120px; }
        .send-btn { background: var(--accent); color: white; border: none; border-radius: var(--radius); width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .thinking { color: var(--text-secondary); font-style: italic; }
        .tool-call { background: #fef3c7; padding: 0.5rem; border-radius: var(--radius); margin: 0.5rem 0; font-size: 0.85rem; }
        .tool-result { background: #d1fae5; padding: 0.5rem; border-radius: var(--radius); margin: 0.5rem 0; font-size: 0.85rem; }
        .error { color: #ef4444; }
        @media (max-width: 768px) { .sidebar { display: none; } }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <button class="new-chat-btn" onclick="newChat()">+ New Chat</button>
        </div>
        <div class="connection-status">
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Disconnected</span>
        </div>
    </aside>
    <div class="main">
        <div class="header">
            <span class="header-title">Manta v{VERSION}</span>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme">&#9788;</button>
        </div>
        <div class="messages" id="messages"></div>
        <div class="input-area">
            <div class="input-wrapper">
                <textarea id="input" rows="1" placeholder="Message Manta..." onkeydown="handleKey(event)"></textarea>
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">&#10147;</button>
            </div>
        </div>
    </div>

    <script>
        const WS_URL = (location.protocol === 'https:' ? 'wss:' : 'ws:') + '//' + location.host + '/ws';
        let ws = null;
        let connected = false;
        let sessionId = localStorage.getItem('manta_session') || generateId();
        let reqId = 0;
        let pendingMessages = new Map();
        let currentAssistantMsg = null;

        function generateId() {
            return 'sess_' + Math.random().toString(36).slice(2, 10);
        }

        function saveSession() {
            localStorage.setItem('manta_session', sessionId);
        }

        function toggleTheme() {
            const html = document.documentElement;
            const current = html.getAttribute('data-theme');
            html.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
            localStorage.setItem('theme', html.getAttribute('data-theme'));
        }

        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);

        function setStatus(connected) {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.classList.toggle('connected', connected);
            text.textContent = connected ? 'Connected' : 'Disconnected';
        }

        function connect() {
            if (ws) ws.close();
            ws = new WebSocket(WS_URL);

            ws.onopen = () => {
                setStatus(true);
                // Send connect handshake
                sendRequest('connect', {
                    protocol_version: 1,
                    auth: { token: '' },
                    scopes: ['chat', 'read']
                });
            };

            ws.onclose = () => {
                setStatus(false);
                connected = false;
                setTimeout(connect, 3000);
            };

            ws.onerror = (e) => {
                console.error('WebSocket error:', e);
                setStatus(false);
            };

            ws.onmessage = (event) => {
                try {
                    const msg = JSON.parse(event.data);
                    handleMessage(msg);
                } catch (e) {
                    console.error('Failed to parse message:', e);
                }
            };
        }

        function sendRequest(method, params) {
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            const id = 'req_' + (++reqId);
            ws.send(JSON.stringify({ type: 'req', id, method, params }));
            return id;
        }

        function handleMessage(msg) {
            if (msg.type === 'res') {
                if (msg.ok && msg.payload) {
                    if (msg.payload.protocol_version) {
                        connected = true;
                        addSystemMessage('Connected to Manta Gateway. Session: ' + sessionId);
                    }
                }
            } else if (msg.type === 'event') {
                handleEvent(msg);
            }
        }

        function handleEvent(evt) {
            switch (evt.event) {
                case 'chat.delta':
                    appendToAssistant(evt.payload?.content || '');
                    break;
                case 'chat.final':
                    finalizeAssistant(evt.payload?.response || '');
                    break;
                case 'agent.thinking':
                    showThinking(evt.payload?.content || '');
                    break;
                case 'tool.calling':
                    showToolCall(evt.payload?.tool_name || '', evt.payload?.arguments || {});
                    break;
                case 'tool.result':
                    showToolResult(evt.payload?.tool_name || '', evt.payload?.result || '');
                    break;
                case 'chat.error':
                    addSystemMessage('Error: ' + (evt.payload?.message || 'Unknown error'), true);
                    break;
            }
        }

        function addMessage(role, text, html = false) {
            const container = document.getElementById('messages');
            const msg = document.createElement('div');
            msg.className = 'message ' + role;
            const avatarText = role === 'user' ? 'You' : role === 'assistant' ? 'AI' : '...';
            const avatarClass = role === 'user' ? 'user' : role === 'assistant' ? 'assistant' : '';
            msg.innerHTML = `<div class="avatar ${avatarClass}">${avatarText}</div><div class="content"></div>`;
            const content = msg.querySelector('.content');
            if (html) content.innerHTML = text;
            else content.textContent = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
            return content;
        }

        function addSystemMessage(text, isError = false) {
            const container = document.getElementById('messages');
            const msg = document.createElement('div');
            msg.className = 'message system' + (isError ? ' error' : '');
            msg.textContent = text;
            container.appendChild(msg);
            container.scrollTop = container.scrollHeight;
        }

        function appendToAssistant(text) {
            if (!currentAssistantMsg) {
                currentAssistantMsg = addMessage('assistant', '');
            }
            currentAssistantMsg.textContent += text;
            const container = document.getElementById('messages');
            container.scrollTop = container.scrollHeight;
        }

        function finalizeAssistant(text) {
            if (!currentAssistantMsg) {
                currentAssistantMsg = addMessage('assistant', text);
            } else if (text) {
                currentAssistantMsg.textContent = text;
            }
            currentAssistantMsg = null;
            setLoading(false);
        }

        function showThinking(text) {
            if (!currentAssistantMsg) {
                currentAssistantMsg = addMessage('assistant', '');
            }
            currentAssistantMsg.innerHTML = '<span class="thinking">Thinking: ' + escapeHtml(text) + '</span>';
        }

        function showToolCall(name, args) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<div class="avatar assistant">T</div><div class="content"><div class="tool-call">Using <b>${escapeHtml(name)}</b><pre>${escapeHtml(JSON.stringify(args, null, 2))}</pre></div></div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function showToolResult(name, result) {
            const container = document.getElementById('messages');
            const div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = `<div class="avatar assistant">T</div><div class="content"><div class="tool-result"><b>${escapeHtml(name)}</b> result:<pre>${escapeHtml(typeof result === 'string' ? result : JSON.stringify(result, null, 2))}</pre></div></div>`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function setLoading(loading) {
            document.getElementById('sendBtn').disabled = loading;
        }

        function sendMessage() {
            const input = document.getElementById('input');
            const text = input.value.trim();
            if (!text || !connected) return;

            addMessage('user', text);
            input.value = '';
            input.style.height = 'auto';
            setLoading(true);

            sendRequest('chat.send', {
                session_id: sessionId,
                content: text,
            });
        }

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
            const textarea = e.target;
            textarea.style.height = 'auto';
            textarea.style.height = textarea.scrollHeight + 'px';
        }

        function newChat() {
            sessionId = generateId();
            saveSession();
            document.getElementById('messages').innerHTML = '';
            addSystemMessage('New session: ' + sessionId);
        }

        connect();
        addSystemMessage('Connecting to Manta...');
    </script>
</body>
</html>
