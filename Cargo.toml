[package]
name = "syscity"
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
authors = ["Syscity Contributors"]
description = "Syscity - A Rust application"
license = "Apache-2.0"
repository = "https://github.com/lightconsen/syscity"

[workspace]
members = ["crates/*", "desktop"]

[dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }
rustyline = { version = "14.0", default-features = false }
dialoguer = { version = "0.11", default-features = false, features = ["password"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"
toml = "0.8"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }

# Configuration
config = "0.14"

# HTTP client
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream", "blocking"], default-features = false }
bytes = "1.5"

# HTTP server
axum = { version = "0.7", features = ["ws"] }
axum-extra = "0.9"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["fs", "cors"] }

# WebSocket client
tokio-tungstenite = "0.24"

# JSON
serde_json = "1.0"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
notify = "6.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
dirs = "6.0"

# YAML support
serde_yaml = "0.9"

# Async trait support
async-trait = "0.1"

# Futures for streaming
futures = "0.3"
async-stream = "0.3"

# Random number generation for jitter
rand = "0.8"

# Cron expression parsing
cron = "0.14"

# Glob patterns
glob = "0.3"

# URL encoding
urlencoding = "2.1"

# OAuth2
oauth2 = { version = "5.0", features = ["reqwest"] }

# Regex for security scanning
regex = "1.10"

# IP network parsing for trusted proxy CIDR matching
ipnet = "2.9"

# System monitoring (CPU, memory, disk, network, processes)
sysinfo = "0.30"

# Browser automation (optional)
chromiumoxide = { version = "0.9", optional = true }
url = "2.5"

# Shell expansion for paths
shellexpand = "3.1"

# LRU cache for session caching
lru = "0.18"

# Concurrent hashmap for rate limiter
dashmap = "6.0"

# Webhook signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }
subtle = "2.5"

# Secure secret handling
zeroize = { version = "1.7", features = ["derive"] }
flate2 = "1.1.9"
zip = "2"
tar = "0.4"

# Audio capture (cross-platform I/O)
cpal = "0.15"

# Embed frontend assets into binary for single-file distribution
rust-embed = "8"

# System resource limits and signals (Unix only)
[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["signal", "process"] }

# Daemon functionality
daemonize = "0.5"

# Database
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite", "migrate", "chrono"] }

# Vector database (QMD/LanceDB-style)
pgvector = { version = "0.4", optional = true, features = ["sqlx"] }
lancedb = { version = "0.16", optional = true }
libsqlite3-sys = { version = "0.30.1", optional = true }
sqlite-vec = { version = "0.1", optional = true }

# Embeddings (using API-based providers for now)
# fastembed has dependency issues with ort crate
# llama-cpp-2 for full GGUF support
llama-cpp-2 = { version = "0.1", optional = true }
# HuggingFace Hub for model auto-download
hf-hub = { version = "0.5", optional = true, features = ["tokio"] }

# Plugin system (WASM runtime)
wasmtime = { version = "45.0", optional = true }
wasmtime-wasi = { version = "45.0", optional = true }

# Hot reload - file watching
notify-debouncer-full = { version = "0.3", optional = true }

# Vision (OCR + UI element detection via ONNX)
ort = { version = "2.0.0-rc.12", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"], optional = true }
ndarray = { version = "0.17", optional = true }

# QR code generation for device pairing
qrcode = "0.14"

# Terminal UI (optional)
ratatui = { version = "0.29" }
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-util = { version = "0.7" }
unicode-width = { version = "0.2" }

# Channels (optional)
teloxide = { version = "0.17", features = ["macros"], optional = true }
serenity = { version = "0.12", default-features = false, features = ["client", "gateway", "rustls_backend", "model"], optional = true }

[features]
default = ["telegram", "discord", "slack", "whatsapp", "qq", "feishu", "signal", "imessage", "webchat", "plugins", "hot-reload", "local-embeddings", "browser"]
telegram = ["teloxide"]
discord = ["serenity"]
slack = []
whatsapp = []
qq = []
feishu = []
signal = []
imessage = []
webchat = []
all-channels = ["telegram", "discord", "slack", "whatsapp", "qq", "feishu", "signal", "imessage", "webchat"]
tailscale = []
web = []
browser = ["chromiumoxide"]
vector-db = ["lancedb"]
local-embeddings = ["llama-cpp-2", "hf-hub"]
plugins = ["wasmtime", "wasmtime-wasi"]
hot-reload = ["notify-debouncer-full"]
vision = ["ort", "image", "ndarray"]
pgvector = ["dep:pgvector", "pgvector/sqlx", "sqlx/postgres"]
sqlite-vec = ["dep:sqlite-vec", "dep:libsqlite3-sys"]
# TUI is no longer optional; kept as a no-op feature for backwards compatibility
tui = []

# Note: Discord and Slack use reqwest for HTTP API calls
# WhatsApp, QQ, Lark use reqwest with custom implementations
# Browser automation requires Chrome/Chromium installed

[dev-dependencies]
# Testing
tokio-test = "0.4"
wiremock = "0.6"
mockall = "0.12"
tempfile = "3.10"

# Assertions
pretty_assertions = "1.4"

# Concurrency control for tests
serial_test = "3.0"

# Snapshot testing (like Vitest snapshots)
insta = { version = "1.39", features = ["yaml", "json"] }

# Benchmark framework
criterion = { version = "0.5", features = ["html_reports"] }

# Browser automation for E2E tests
chromiumoxide = { version = "0.9" }

[[bench]]
name = "message_routing"
harness = false

[[bench]]
name = "serialization"
harness = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 0
debug = true
